plugins {
    id 'fabric-loom' version '1.14.10'
}
version = '1.0.0'
group = 'org.ocarina'
base { archivesName = 'steve-fabric-bridge' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation fabricApi.module('fabric-api-base', '0.141.6+1.21.11')
    modImplementation fabricApi.module('fabric-lifecycle-events-v1', '0.141.6+1.21.11')
}
loom { serverOnlyMinecraftJar() }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
